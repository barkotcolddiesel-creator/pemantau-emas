<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harga Emas Harian</title>
<style>
:root{--bg:#F2F4F6;--card:#fff;--ink:#17202B;--mute:#5E6B7A;--line:#DDE2E8;--up:#18794E;--down:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0F141A;--card:#18202A;--ink:#EEF1F4;--mute:#9AA7B5;--line:#2A3541;--up:#4CC38A;--down:#FF8A80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}h1{font:700 22px Georgia,serif;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.p{font:700 30px Georgia,serif}.u{color:var(--mute);font-size:14px}.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute)}.tw{overflow-x:auto}
</style></head><body><main>
<h1>Harga emas harian</h1><div id="c"></div>
<div class="card"><div class="tw" id="h"></div></div>
<script>
var rp=function(v){return v==null?'-':'Rp '+v.toLocaleString('id-ID')},us=function(v){return v==null?'-':'$'+v.toLocaleString('en-US',{minimumFractionDigits:2})};
var fd=function(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
function card(t,k,f,d){var l=d.filter(function(x){return x[k]!=null}),c=l[l.length-1],p=l[l.length-2];
if(!c)return'<div class="card"><div class="u">'+t+'</div>Belum ada data</div>';
var dl='';if(p){var x=c[k]-p[k];dl='<div class="'+(x>=0?'up':'down')+'">'+(x>=0?'Naik ':'Turun ')+f(Math.abs(x))+' ('+Math.abs(x/p[k]*100).toFixed(2)+'%)</div>'}
return'<div class="card"><div class="u">'+t+', '+fd(c.d)+'</div><div class="p">'+f(c[k])+'</div>'+dl+'</div>'}
fetch('data.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){
document.getElementById('c').innerHTML=card('Antam per gram','a',rp,d)+card('Emas dunia per ons','w',us,d);
document.getElementById('h').innerHTML='<table><tr><th>Tanggal</th><th>Antam</th><th>Dunia</th></tr>'+d.slice().reverse().map(function(x){return'<tr><td>'+fd(x.d)+'</td><td>'+rp(x.a)+'</td><td>'+us(x.w)+'</td></tr>'}).join('')+'</table>'
}).catch(function(){document.getElementById('c').textContent='Data belum tersedia.'});
</script></main></body></html>
